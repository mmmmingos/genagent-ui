<title>GenUI Catch-up</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Prototype v2: version 1 of research/BRIEF.md (come back and catch up). Tokens are the app's own (web/app.css, from research/DESIGN.md). */
:root {
  color-scheme: light;
  --font-sans: "Inter", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "Geist Mono", ui-monospace, "SF Mono", "Cascadia Mono", Menlo, Consolas, monospace;
  --bg-page: #ffffff; --bg-sidebar: #fafafa; --bg-card: #ffffff; --bg-raised: #f5f5f5; --bg-hover: #efefef; --bg-active: #ebebeb; --bg-row-active: #fafafa;
  --border: rgba(0,0,0,.07); --border-strong: rgba(0,0,0,.10); --divider: #f0f0f0; --track: #f0f0f0;
  --text-1: #171717; --text-2: #737373; --text-3: #a3a3a3; --text-4: #d4d4d4;
  --accent: #2f6bea; --accent-dot: #3b82f6; --accent-line: #a1ccf5; --accent-ink: #2b54a8; --accent-tint: #edf2fc; --accent-tint-hover: #e3ebfb; --accent-chip: #f1f6fe; --accent-ring: 0 0 0 3px rgba(47,107,234,.16);
  --amber-dot: #f0a80d; --amber-ink: #b45309; --amber-tint: #fffbeb; --amber-ring: #f8d9a6; --amber-halo: #fdeccb; --amber-flash: #fcf3ed;
  --green-dot: #22c55e; --green-ink: #15803d; --green-tint: #f0fdf4; --green-ring: #bbf7d0;
  --grey-dot: #c0c0c0; --grey-line: #d4d4d4; --grey-chip: #f1f1f1;
  --shine-1: #8f8f8f; --shine-2: #c8c8c8;
  --shadow-card: 0 1px 2px rgba(0,0,0,.02), 0 4px 16px -4px rgba(0,0,0,.04);
  --shadow-pop: 0 8px 24px rgba(0,0,0,.08);
  --ease-out: cubic-bezier(.2,.8,.2,1);
  /* The terminal is always dark. */
  --term-bg: #141414; --term-fg: #d6d6d6; --term-dim: #8a8a8a; --term-faint: #5c5c5c; --term-user: #262626; --term-ok: #6fcf7f; --term-bullet: #e8e8e8; --term-amber: #e9b04a;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg-page:#0f0f0f; --bg-sidebar:#121212; --bg-card:#191919; --bg-raised:#252525; --bg-hover:#2a2a2a; --bg-active:#2e2e2e; --bg-row-active:#1f1f1f;
    --border:rgba(255,255,255,.07); --border-strong:rgba(255,255,255,.11); --divider:#282828; --track:#262626;
    --text-1:#f0f0f0; --text-2:#a3a3a3; --text-3:#6e6e6e; --text-4:#3f3f3f;
    --accent:#2f5cdd; --accent-dot:#4880e8; --accent-line:#435379; --accent-ink:#b6c9f5; --accent-tint:#1e232e; --accent-tint-hover:#252c3a; --accent-chip:#162333; --accent-ring:0 0 0 3px rgba(72,128,232,.30);
    --amber-dot:#e59f1c; --amber-ink:#e9b04a; --amber-tint:#2a2112; --amber-ring:#5a4220; --amber-halo:#3a2a0f; --amber-flash:#2a211b;
    --green-dot:#50e359; --green-ink:#5fd16a; --green-tint:#132815; --green-ring:#1f4a26;
    --grey-dot:#5e5e5e; --grey-line:#3a3a3a; --grey-chip:#252525; --shine-1:#7d7d7d; --shine-2:#6e6e6e;
    --shadow-card: inset 0 1px 0 rgba(255,255,255,.03); --shadow-pop: 0 8px 24px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.04);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg-page:#0f0f0f; --bg-sidebar:#121212; --bg-card:#191919; --bg-raised:#252525; --bg-hover:#2a2a2a; --bg-active:#2e2e2e; --bg-row-active:#1f1f1f;
  --border:rgba(255,255,255,.07); --border-strong:rgba(255,255,255,.11); --divider:#282828; --track:#262626;
  --text-1:#f0f0f0; --text-2:#a3a3a3; --text-3:#6e6e6e; --text-4:#3f3f3f;
  --accent:#2f5cdd; --accent-dot:#4880e8; --accent-line:#435379; --accent-ink:#b6c9f5; --accent-tint:#1e232e; --accent-tint-hover:#252c3a; --accent-chip:#162333; --accent-ring:0 0 0 3px rgba(72,128,232,.30);
  --amber-dot:#e59f1c; --amber-ink:#e9b04a; --amber-tint:#2a2112; --amber-ring:#5a4220; --amber-halo:#3a2a0f; --amber-flash:#2a211b;
  --green-dot:#50e359; --green-ink:#5fd16a; --green-tint:#132815; --green-ring:#1f4a26;
  --grey-dot:#5e5e5e; --grey-line:#3a3a3a; --grey-chip:#252525; --shine-1:#7d7d7d; --shine-2:#6e6e6e;
  --shadow-card: inset 0 1px 0 rgba(255,255,255,.03); --shadow-pop: 0 8px 24px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.04);
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg-page); color: var(--text-1); font: 400 15px/24px var(--font-sans); -webkit-font-smoothing: antialiased; overflow: hidden; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; text-align: inherit; }
textarea, input { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.mono, code { font-family: var(--font-mono); font-variant-ligatures: none; }
.num { font-variant-numeric: tabular-nums; }
.t2 { color: var(--text-2); } .t3 { color: var(--text-3); }
.ic { width: 16px; height: 16px; flex: none; }
.ic.s12 { width: 12px; height: 12px; } .ic.s14 { width: 14px; height: 14px; }
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes shimmer { from { background-position: 100% 0; } to { background-position: 0 0; } }
@keyframes enter { from { opacity: 0; filter: blur(5px); transform: translateY(4px); } to { opacity: 1; filter: none; transform: none; } }
@keyframes flash { from { background: var(--accent-tint); } to { background: transparent; } }
.enter { animation: enter 220ms var(--ease-out) both; }
.flash { animation: flash 1.6s var(--ease-out); }
.shine { background: linear-gradient(90deg, currentColor 0 40%, var(--shine-1) 50%, currentColor 60% 100%) 0 0 / 300% 100%; -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; animation: shimmer 1.4s linear infinite; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }

/* ---- Shell ---- */
.app { display: grid; grid-template-columns: 248px minmax(0, 1fr); height: 100%; }
.side { background: var(--bg-sidebar); border-right: 1px solid var(--divider); padding: 12px 8px; display: flex; flex-direction: column; gap: 2px; overflow: auto; min-height: 0; }
.logo { display: flex; align-items: center; gap: 8px; padding: 4px 8px 12px; font-weight: 600; font-size: 15px; }
.tag { font-size: 12px; font-weight: 500; color: var(--text-2); background: var(--grey-chip); border-radius: 999px; padding: 0 8px; line-height: 20px; }
.srow { display: flex; align-items: center; gap: 8px; height: 32px; padding: 0 8px; border-radius: 8px; width: 100%; font-size: 14px; }
.srow:hover { background: var(--bg-hover); }
.srow.on { background: var(--bg-active); font-weight: 500; }
.srow .st { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.srow .ic { color: var(--text-2); }
.sgroup { font-size: 13px; color: var(--text-3); padding: 16px 8px 4px; }
.sfoot { margin-top: auto; padding: 12px 8px 4px; font-size: 13px; line-height: 18px; color: var(--text-3); }
.dot { width: 8px; height: 8px; border-radius: 50%; flex: none; position: relative; }
.dot.working { background: var(--accent-dot); }
.dot.working::after { content: ""; position: absolute; inset: -3px; border-radius: 50%; border: 1.5px solid transparent; border-top-color: var(--text-2); border-right-color: var(--text-2); animation: spin .8s linear infinite; }
.dot.needs { background: var(--amber-dot); }
.dot.turn { background: var(--grey-dot); }
.badge { min-width: 18px; height: 18px; border-radius: 999px; border: 1px solid var(--amber-ring); background: var(--amber-tint); color: var(--amber-ink); font-size: 12px; font-weight: 500; line-height: 16px; text-align: center; padding: 0 5px; flex: none; font-variant-numeric: tabular-nums; }
.newchip { height: 20px; border-radius: 999px; background: var(--accent-chip); color: var(--accent-ink); font-size: 12px; font-weight: 500; line-height: 20px; padding: 0 8px; white-space: nowrap; }
.main { min-width: 0; min-height: 0; overflow: auto; position: relative; }

/* ---- Buttons ---- */
.btn { height: 34px; padding: 0 14px; border-radius: 999px; font-size: 14px; font-weight: 500; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; transition: background 150ms; }
.btn.sm { height: 28px; padding: 0 12px; font-size: 13px; }
.btn-tint { background: var(--accent-tint); color: var(--accent-ink); }
.btn-tint:hover { background: var(--accent-tint-hover); }
.btn-neutral { background: var(--bg-raised); color: var(--text-1); }
.btn-neutral:hover { background: var(--bg-hover); }
.btn-text { color: var(--text-2); padding: 0 8px; }
.btn-text:hover { color: var(--text-1); }
.btn[disabled] { opacity: .45; cursor: default; }
.ibtn { width: 32px; height: 32px; border-radius: 8px; display: inline-grid; place-items: center; color: var(--text-2); }
.ibtn:hover { background: var(--bg-hover); color: var(--text-1); }
.lnk { color: var(--text-2); font-size: 13px; display: inline-flex; align-items: center; gap: 4px; border-bottom: 1px dotted var(--text-4); line-height: 18px; }
.lnk:hover { color: var(--text-1); border-bottom-color: var(--text-2); }
.spin { width: 14px; height: 14px; border-radius: 50%; border: 1.5px solid var(--track); border-top-color: var(--text-2); animation: spin .8s linear infinite; flex: none; }

/* ---- Dashboard ---- */
.dash { max-width: 1104px; margin: 0 auto; padding-block: 28px 64px; padding-inline: 32px; display: flex; flex-direction: column; gap: 16px; }
.dhead { display: flex; align-items: flex-end; gap: 16px; flex-wrap: wrap; }
.dhead h1 { font-size: 16px; line-height: 24px; font-weight: 600; margin: 0; }
.back-line { font-size: 15px; color: var(--text-2); margin: 2px 0 0; }
.back-line b { color: var(--text-1); font-weight: 500; }
.sumline { font-size: 15px; color: var(--text-2); }
.sumline b { color: var(--text-1); font-weight: 500; }
.sumline b.am { color: var(--amber-ink); }
.seg { margin-left: auto; display: inline-flex; background: var(--bg-raised); border-radius: 999px; padding: 3px; gap: 2px; }
.seg button { height: 28px; padding: 0 12px; border-radius: 999px; font-size: 13px; font-weight: 500; color: var(--text-2); display: inline-flex; align-items: center; gap: 6px; }
.seg button.on { background: var(--bg-card); color: var(--text-1); box-shadow: 0 1px 2px rgba(0,0,0,.06), 0 0 0 1px var(--border); }
.card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 16px; box-shadow: var(--shadow-card); }
.rows { overflow: hidden; }
.arow { cursor: pointer; display: grid; grid-template-columns: minmax(0, 1fr) 236px 132px; column-gap: 20px; padding: 14px 16px; border-top: 1px solid var(--divider); width: 100%; align-items: start; transition: background 150ms; }
.arow:first-child { border-top: 0; }
.arow:hover { background: var(--bg-row-active); }
.ar-t { display: flex; align-items: center; gap: 8px; min-width: 0; }
.ar-t .tt { font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ar-sub { font-size: 13px; line-height: 18px; color: var(--text-2); margin: 2px 0 8px 16px; }
.ar-l { font-size: 14px; line-height: 20px; margin-left: 16px; display: flex; gap: 8px; }
.ar-l + .ar-l { margin-top: 2px; }
.ar-l .k { flex: none; width: 46px; color: var(--text-3); }
.ar-l .v { color: var(--text-2); min-width: 0; }
.ar-l.need .k { color: var(--amber-ink); }
.ar-l.need .v { color: var(--text-1); }
.ar-l.now .v { color: var(--text-1); }
.ar-flow { padding-top: 2px; }
.ar-flow svg { display: block; overflow: visible; }
.ar-st { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
.stl { display: inline-flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 500; white-space: nowrap; }
.stl .d { width: 6px; height: 6px; border-radius: 50%; }
.stl.needs { color: var(--amber-ink); } .stl.needs .d { background: var(--amber-dot); }
.stl.working { color: var(--accent-ink); } .stl.working .d { background: var(--accent-dot); }
.stl.turn { color: var(--text-2); } .stl.turn .d { background: var(--grey-dot); }
.ar-meta { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--text-3); }
.mf-done { fill: var(--grey-dot); } .mf-new { fill: var(--text-2); } .mf-amber { fill: var(--amber-dot); }
.mf-line { stroke: var(--grey-line); stroke-width: 1.5; fill: none; }
.mf-line.cur { stroke: var(--accent-line); }
.mf-ring { fill: var(--bg-card); stroke: var(--text-2); stroke-width: 1.5; }
.mf-spur { stroke: var(--text-3); stroke-width: 1.2; stroke-dasharray: 2 2; }
.mf-x { stroke: var(--text-3); stroke-width: 1.5; stroke-linecap: round; }
.mf-look { stroke: var(--text-3); stroke-width: 1; stroke-dasharray: 2 2; }
.mf-more { fill: var(--text-3); font: 500 11px var(--font-sans); }
.mf-halo { fill: var(--amber-halo); } .mf-disc { fill: var(--amber-dot); } .mf-mark { stroke: #fff; stroke-width: 2; stroke-linecap: round; }
.mf-turn { fill: var(--text-3); } .mf-work { fill: var(--accent-dot); } .mf-orbit { stroke: var(--text-1); stroke-width: 1.5; fill: none; stroke-linecap: round; }
.dlegend { display: flex; gap: 16px; flex-wrap: wrap; font-size: 13px; color: var(--text-3); padding: 0 4px; }
.dlegend span { display: inline-flex; align-items: center; gap: 6px; }
.lg-look { width: 0; height: 12px; border-left: 1px dashed var(--text-3); }
.lg-ring { width: 9px; height: 9px; border-radius: 50%; border: 1.5px solid var(--text-2); }
.lg-x { color: var(--text-3); font-size: 14px; line-height: 1; }

/* All needs */
.nlist { overflow: hidden; }
.ngroup { border-top: 1px solid var(--divider); }
.ngroup:first-child { border-top: 0; }
.ng-h { display: flex; align-items: center; gap: 8px; padding: 12px 16px 4px; font-size: 14px; font-weight: 500; }
.ng-h .t2 { font-weight: 400; font-size: 13px; }
.nitem { display: grid; grid-template-columns: minmax(0,1fr) auto; gap: 4px 16px; padding: 8px 16px 8px 32px; width: 100%; align-items: center; }
.nitem:hover { background: var(--bg-row-active); }
.nitem .q { font-weight: 500; }
.nitem .c { font-size: 13px; line-height: 18px; color: var(--text-2); grid-column: 1; }
.nitem .w { font-size: 13px; color: var(--text-3); white-space: nowrap; grid-row: 1 / span 2; grid-column: 2; display: flex; align-items: center; gap: 8px; }
.ng-foot { padding: 4px 16px 14px 32px; }
.old { color: var(--amber-ink); }

/* ---- Session ---- */
.sess { display: grid; grid-template-rows: 48px minmax(0, 1fr); height: 100%; }
.shead { display: flex; align-items: center; gap: 10px; padding: 0 12px 0 8px; border-bottom: 1px solid var(--divider); min-width: 0; }
.shead .tt { font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.shead .meta { font-size: 14px; color: var(--text-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; flex: 1; }
.sbody { display: grid; grid-template-columns: minmax(0, 1fr) 460px; min-height: 0; }

.term { background: var(--term-bg); color: var(--term-fg); display: flex; flex-direction: column; min-height: 0; min-width: 0; }
.tstrip { height: 34px; flex: none; display: flex; align-items: center; gap: 8px; padding: 0 14px; font-size: 13px; color: var(--term-dim); border-bottom: 1px solid #222; }
.tstrip .d { width: 6px; height: 6px; border-radius: 50%; background: var(--term-amber); }
.tstrip .d.working { background: #4880e8; } .tstrip .d.turn { background: #5e5e5e; }
.tscroll { flex: 1; overflow: auto; padding: 14px 16px 8px; font: 13px/20px var(--font-mono); font-variant-ligatures: none; min-height: 0; }
.tl { white-space: pre-wrap; word-break: break-word; }
.tl.u { background: var(--term-user); color: #f2f2f2; padding: 2px 8px; margin: 10px 0 6px; border-radius: 3px; }
.tl.b { color: var(--term-fg); margin-top: 6px; }
.tl.b::first-letter { color: var(--term-bullet); }
.tl.r { color: var(--term-dim); padding-left: 2ch; }
.tl.ok { color: var(--term-ok); padding-left: 2ch; }
.tl.m { color: #ededed; margin-top: 6px; }
.tl.am { color: var(--term-amber); }
.tl.ind { padding-left: 2ch; margin-top: 0; }
.tl.hl { animation: termhl 2s var(--ease-out); }
@keyframes termhl { from { background: #2b3348; } to { background: transparent; } }
.tl.work { color: #d9895c; margin-top: 8px; }
.tbox { margin: 10px 16px 0; border: 1px solid #555; border-radius: 6px; padding: 4px 10px; font: 13px/20px var(--font-mono); color: var(--term-dim); flex: none; }
.thint { padding: 4px 26px 12px; font: 12px/18px var(--font-mono); color: var(--term-faint); flex: none; }

.rail { border-left: 1px solid var(--divider); overflow: auto; min-height: 0; padding: 16px 16px 48px; display: flex; flex-direction: column; gap: 20px; }
.rsec-h { display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 600; margin-bottom: 10px; }
.rsec-h .t2, .rsec-h .t3 { font-weight: 400; font-size: 13px; }
.rsec-h .sp { flex: 1; }
.away { padding: 12px 14px; border-radius: 12px; background: var(--accent-chip); font-size: 14px; line-height: 21px; }
.away .h { display: flex; align-items: center; gap: 8px; font-weight: 500; color: var(--accent-ink); }
.away p { margin: 4px 0 0; color: var(--text-1); }

/* Needs from you */
.needs { display: flex; flex-direction: column; gap: 10px; }
.need { padding: 14px 14px 12px; }
.need.focus { box-shadow: 0 0 0 2px var(--amber-ring), var(--shadow-card); }
.nh { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--text-2); line-height: 18px; }
.nh .sp { flex: 1; }
.nq { font-weight: 600; margin-top: 6px; }
.nc { font-size: 14px; line-height: 20px; color: var(--text-2); margin-top: 2px; }
.opts { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
.opt { min-height: 32px; display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 16px; background: var(--bg-raised); font-size: 14px; line-height: 20px; font-weight: 500; transition: background 150ms; max-width: 100%; }
.opt:hover { background: var(--bg-hover); }
.opt .q2 { margin-left: 2px; font-weight: 400; color: var(--text-2); font-size: 13px; }
.opt.on { background: var(--accent-chip); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--accent-dot) 60%, transparent); }
.opt.on .q2 { color: var(--accent-ink); }
.opt.else { color: var(--text-2); font-weight: 400; }
.opt .ck { margin-left: 2px; display: inline-flex; color: var(--accent-ink); }
.elsein { width: 100%; min-height: 40px; border-radius: 10px; border: 1px solid var(--accent); box-shadow: var(--accent-ring); background: var(--bg-card); padding: 8px 12px; font-size: 14px; line-height: 20px; outline: none; resize: none; display: block; }
.nfoot { display: flex; align-items: center; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
.nfoot .sp { flex: 1; }
.side-draft { margin-top: 10px; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--border-strong); font-size: 14px; line-height: 21px; }
.side-draft .h { font-size: 13px; color: var(--text-2); display: flex; align-items: center; gap: 6px; margin-bottom: 4px; }
.side-draft .acts { display: flex; gap: 6px; margin-top: 8px; }
.need.done { padding: 10px 14px; display: flex; align-items: center; gap: 10px; }
.need.done .q { color: var(--text-2); font-size: 14px; flex: 1; min-width: 0; line-height: 20px; }
.need.done .a { font-size: 14px; color: var(--text-1); text-align: right; max-width: 48%; line-height: 20px; }
.gck { width: 18px; height: 18px; border-radius: 50%; background: var(--green-tint); border: 1px solid var(--green-ring); color: var(--green-ink); display: grid; place-items: center; flex: none; }

.reply { padding: 14px; }
.reply .h { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--text-2); margin-bottom: 8px; }
.reply .h .sp { flex: 1; }
.reply textarea { width: 100%; min-height: 112px; border: 1px solid var(--border-strong); border-radius: 12px; background: var(--bg-card); padding: 10px 12px; font-size: 14px; line-height: 21px; resize: vertical; outline: none; display: block; }
.reply textarea:focus { border-color: var(--accent); box-shadow: var(--accent-ring); }
.reply .f { display: flex; align-items: center; gap: 10px; margin-top: 10px; }

// ---- Dashboard: the mini branches flow for one agent ----
function miniFlow(a) {
  // One straight line, oldest on the left: a ring for each of your messages, a dot for each step,
  // a short spur with × for work that was dropped when you changed direction.
  const items = [];
  a.goals.forEach((g, gi) => { items.push({ g, gi, goal: true }); g.steps.forEach((s) => items.push({ s, gi })); });
  const W = 236, pitch = 16, maxN = 13, y = 26;
  const hidden = Math.max(0, items.length - maxN), vis = items.slice(hidden);
  const x0 = hidden ? 30 : 8;
  vis.forEach((n, i) => (n.x = x0 + i * pitch));
  let svg = `<path class="mf-line" d="M${vis[0].x},${y} H${vis.at(-1).x}"/>`;
  const curStart = vis.find((n) => n.goal && n.gi === a.goals.length - 1);
  if (curStart) svg += `<path class="mf-line cur" d="M${curStart.x},${y} H${vis.at(-1).x}"/>`;
  if (hidden) svg += `<text class="mf-more" x="0" y="${y + 4}">+${hidden}</text>`;
  const firstNew = vis.findIndex((n) => n.s && n.s.new && !a.seen);
  if (firstNew > 0) { const x = vis[firstNew].x - pitch / 2; svg += `<line class="mf-look" x1="${x}" y1="6" x2="${x}" y2="42"><title>You looked at ${LEFT}</title></line>`; }
  for (const n of vis) {
    if (n.goal) { svg += `<circle class="mf-ring" cx="${n.x}" cy="${y}" r="4.5"><title>You: ${esc(n.g.label)}</title></circle>`; continue; }
    const s = n.s, label = esc(s.l);
    if (s.dropped) { svg += `<g><title>Dropped: ${label}</title><path class="mf-spur" d="M${n.x - pitch},${y} L${n.x},${y - 13}"/><path class="mf-x" d="M${n.x - 3},${y - 16} l6,6 M${n.x + 3},${y - 16} l-6,6"/></g>`; continue; }
    if (s.current) {
      if (a.state === "needs") svg += `<g><title>${label}</title><circle class="mf-halo" cx="${n.x}" cy="${y}" r="10"/><circle class="mf-disc" cx="${n.x}" cy="${y}" r="7"/><path class="mf-mark" d="M${n.x},${y - 3} V${y + 0.6} M${n.x},${y + 3.2} v0.1"/></g>`;
      else if (a.state === "working") svg += `<g><title>${label}</title><circle class="mf-work" cx="${n.x}" cy="${y}" r="4"/><path class="mf-orbit" d="M${n.x + 8},${y} A8,8 0 1 1 ${n.x - 2.8},${y - 7.5}"><animateTransform attributeName="transform" type="rotate" from="0 ${n.x} ${y}" to="360 ${n.x} ${y}" dur="0.8s" repeatCount="indefinite"/></path></g>`;
      else svg += `<g><title>${label}</title><circle class="mf-turn" cx="${n.x}" cy="${y}" r="6"/></g>`;
    } else {
      const amber = s.ask && s.ask.needs && s.ask.needs.some((id) => !a.needs.find((x) => x.id === id).done);
      svg += `<circle class="${amber ? "mf-amber" : s.new && !a.seen ? "mf-new" : "mf-done"}" cx="${n.x}" cy="${y}" r="${amber ? 4.5 : 3.5}"><title>${label}</title></circle>`;
    }
  }
  return `<svg width="${W}" height="44" viewBox="0 0 ${W} 44" role="img" aria-label="${plural(a.goals.length, "request")}, ${plural(items.length - a.goals.length, "step")}">${svg}</svg>`;
}

// ---- Session: the real terminal on the left, the rail on the right ----
const bullet = (a) => (a.harness === "Codex" ? "•" : a.harness === "Grok" ? "◆" : "⏺");
function termLines(a) {
  const L = [], b = bullet(a);
  for (const g of a.goals) {
    L.push({ c: "u", t: `> ${g.label}` });
    for (const s of g.steps) {
      const first = L.length;
      if (s.sent) { s.sent.forEach((t, i) => L.push({ c: "u", t: (i ? "  " : "> ") + t })); }
      else if (s.current && a.tail && a.tail.length) {
        if (s.l.startsWith("Asks") || s.ask || s.said) { a.tail.forEach((t, i) => L.push({ c: i ? "ind m" : "m", t: i ? t : `${b} ${t}` })); }
      } else if (s.term) { L.push({ c: "b", t: `${b} ${s.term[0]}` }); L.push({ c: "r", t: `⎿  ${s.term[1]}` }); }
      else if (s.cmds) { for (const [cmd, res] of s.cmds) { L.push({ c: "b", t: `${b} Bash(${cmd})` }); L.push({ c: /passed|compiled|match/.test(res) ? "ok" : "r", t: `⎿  ${res}` }); } }
      else if (s.files) { const f = s.files[0]; const verb = /^Read/.test(s.l) ? "Read" : /^Write|^Draft|^Add|^Build/.test(s.l) ? "Write" : "Update"; L.push({ c: "b", t: `${b} ${verb}(${f[0]})` }); L.push({ c: "r", t: `⎿  ${f[1] ? f[1].replace("−", "-") : s.files.length > 1 ? `${s.files.length} files` : "Read 1 file"}` }); }
      else if (s.ask && s.ask.a) { L.push({ c: "b am", t: `${b} ${s.ask.q}` }); L.push({ c: "u", t: `> ${s.ask.a}` }); }
      else L.push({ c: "b", t: `${b} ${s.l}` });
      if (s.said && !s.current) L.push({ c: "m", t: `${b} ${s.said}` });
      if (s.ask && !s.ask.a && !s.current && s.said == null) L.push({ c: "m am", t: `${b} ${s.ask.q}` });
      if (s.ask && !s.ask.a && !s.current && s.said) L.push({ c: "ind m", t: s.ask.q });
      if (L[first]) L[first].step = s.id;
    }
  }
  if (a.state === "working") L.push({ c: "work", t: `✻ ${a.now}… (esc to interrupt)` });
  return L;
}
function renderTerm(a) {
  return termLines(a).map((l) => `<div class="tl ${l.c}"${l.step ? ` data-tstep="${l.step}"` : ""}>${esc(l.t) || " "}</div>`).join("");
}

function needHTML(a, n, i) {

function composeText(a) {

function detailHTML(a, s) {
  const parts = [`<p>${esc(s.sum || s.l)}</p>`];
  if (s.files) parts.push(`<div><div class="dk">Touched</div><div class="refs">${s.files.map(([f, d]) => /^\+\d+ more$/.test(f) ? `<span class="t3" style="font-size:13px">${esc(f)}</span>` : `<span class="refline"><span class="ref">${esc(f)}</span>${d ? `<span class="diff">${esc(d)}</span>` : ""}</span>`).join("")}</div></div>`);
  if (s.cmds) parts.push(`<div><div class="dk">Ran</div><div class="refs">${s.cmds.map(([c, r]) => `<span class="refline"><span class="ref">${esc(c)}</span><span class="t2" style="font-size:13px">${esc(r)}</span></span>`).join("")}</div></div>`);
  if (s.said) parts.push(`<div><div class="dk">${esc(a.harness)} said</div><p class="said">${esc(s.said)}</p></div>`);
  if (s.ask) {
    if (s.ask.a) parts.push(`<div><div class="dk">Asked</div><p>${esc(s.ask.q)}</p><p class="ans"><span class="gck">${icon("check", "s12")}</span>${esc(s.ask.a)} <span class="t3" style="font-size:13px">${esc(s.ask.by)}</span></p></div>`);
    else {
      const ns = s.ask.needs.map((id) => a.needs.find((n) => n.id === id));
      parts.push(`<div><div class="dk">Asked</div>${ns.map((n) => n.done
        ? `<p>${esc(n.q)}</p><p class="ans"><span class="gck">${icon("check", "s12")}</span>${esc(n.answer)} <span class="t3" style="font-size:13px">You · now</span></p>`
        : `<p>${esc(n.q)} <button class="lnk old" data-act="goto-need" data-id="${a.id}" data-need="${n.id}">Still open · answer it</button></p>`).join("")}</div>`);
    }
  }
  parts.push(`<div class="dacts"><button class="lnk" data-act="show-term" data-step="${s.id}">${icon("term", "s12")}Show in the terminal</button><span class="t3" style="font-size:13px">${esc(s.t || "")}</span></div>`);
  return `<div class="tdetail enter">${parts.join("")}</div>`;
}

const EYEBROW = { start: ["chat", "You started"], new: ["chat", "You asked"], turn: ["turn", "You changed direction"] };
function treeHTML(a) {
  // One line, top to bottom, in the order things happened. Each message you sent starts a section;
  // work set aside when you changed direction steps off the line with a ×.
  const lastG = a.goals.length - 1;
  let awayShown = false, h = "";
  a.goals.forEach((g, gi) => {
    const [ic, word] = EYEBROW[g.kind || (gi ? "new" : "start")];
    h += `<div class="trow goal" data-g="${gi}"><span class="nd goal ${gi === lastG ? "cur" : ""}" style="left:11px"></span><span class="lab"><span class="eb">${icon(ic, "s12")}${word} · ${esc(g.by.replace(/^You · /, ""))}</span><span class="gq">“${esc(g.label)}”</span></span></div>`;
    for (const s of g.steps) {
      if (s.new && !awayShown) { awayShown = true; h += `<div class="awayrow">Since you were away · ${LEFT}</div>`; }
      const amber = s.ask && s.ask.needs && s.ask.needs.some((id) => !a.needs.find((n) => n.id === id).done);
      const nd = s.dropped ? "dropped" : s.current ? a.state : amber ? "amber" : "done";
      const lane = s.dropped ? 29 : 11;
      const cls = ["trow", "step", s.dropped ? "dropped" : "", (s.current && a.state === "needs") || amber ? "amber" : "", S.open.has(s.id) ? "sel" : ""].join(" ");
      const label = s.current && a.state === "working" ? `<span class="shine">${esc(s.l)}</span>` : esc(s.l);
      const meta = s.dropped ? `<span>dropped</span>` : s.current && a.state === "working" && a.count ? `<span class="num t2">${esc(a.count)}</span>` : `<span class="num">${esc(s.t || "")}</span>`;
      const glyph = nd === "needs" ? `<svg width="10" height="10" viewBox="0 0 16 16" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round">${ICON.bang}</svg>` : nd === "dropped" ? icon("x", "s12") : "";
      h += `<div class="${cls}" data-act="step" data-step="${s.id}" data-g="${gi}" id="st-${s.id}" role="button" tabindex="0" aria-expanded="${S.open.has(s.id)}">
        <span class="nd ${nd}" style="left:${lane}px">${glyph}</span>
        <span class="lab">${label}</span><span class="rm">${s.new && !a.seen ? `<span class="nw" title="New since you looked"></span>` : ""}${meta}${icon("chev", "s12 chev")}</span></div>`;
      if (S.open.has(s.id)) h += detailHTML(a, s);
    }
  });
  return `<div class="tkey"><span><span class="lg-ring"></span>Your message</span><span><span class="k-dot"></span>A step</span><span title="Work set aside when you changed direction"><span class="lg-x">×</span>Dropped</span></div>
    <div class="tree" id="tree"><svg class="lines" id="tlines"></svg>${h}</div>`;
}

// Draw the line from where the rows actually sit, so opened steps stretch it.
function drawLines() {
  const tree = $("#tree"), svg = $("#tlines"); if (!tree || !svg) return;
  const a = byId(S.id), lastG = a.goals.length - 1;
  const mid = (el) => el.offsetTop + el.offsetHeight / 2;
  const rows = [...tree.querySelectorAll(".trow")];
  const main = rows.filter((r) => !r.classList.contains("dropped"));
  const top = mid(main[0]), bot = mid(main.at(-1));
  const cur = rows.find((r) => r.classList.contains("goal") && +r.dataset.g === lastG);
  let d = "";
  // The current request's stretch is blue; everything before it is grey.
  if (cur && lastG > 0) d += `<path class="ln-grey" d="M11,${top} V${mid(cur)}"/><path class="ln-cur" d="M11,${mid(cur)} V${bot}"/>`;
  else d += `<path class="ln-cur" d="M11,${top} V${bot}"/>`;
  for (const r of rows.filter((r) => r.classList.contains("dropped"))) {
    const y = mid(r);
    d += `<path class="ln-grey ln-dash" d="M11,${y - 26} C11,${y - 12} 29,${y - 16} 29,${y - 6}"/>`;
  }
  svg.setAttribute("height", tree.offsetHeight);
  svg.innerHTML = d;
}

// Discuss it: its own side agent (a copy of this session) to talk the question through with you.
const SUGG = ["What would you recommend?", "What has it built for this so far?", "What changes if I pick the other option?"];
function sideChatHTML(a, n) {
  const c = a.chats[n.id] || (a.chats[n.id] = { msgs: [], draft: "" });
  const i = a.needs.indexOf(n), hasAi = c.msgs.some((m) => m.who === "ai");
  return `<div class="sc">
    <div class="sc-head"><button class="ibtn" data-act="side-close" aria-label="Back" title="Back to what it needs">${icon("back")}</button>
      <div class="tt"><b>Discuss it</b><small>A side agent with a copy of this session. ${esc(a.harness)} won't see any of this unless you send it.</small></div></div>
    <div class="card sc-q"><div class="nh"><span>Question ${i + 1} of ${a.needs.length}</span><span class="sp"></span>${n.old ? `<span class="old">open ${esc(n.open)}</span>` : `<span class="num">${esc(n.when)}</span>`}</div>
      <div class="nq">${esc(n.q)}</div><div class="nc">${esc(n.ctx)}</div>
      <div class="opts">${n.opts.map(([l, q]) => `<span class="opt static">${esc(l)}${q ? `<span class="q2">${esc(q)}</span>` : ""}</span>`).join("")}</div></div>
    <div class="sc-msgs">
      ${!c.msgs.length ? `<div class="sc-empty">Ask anything about this question, over as many messages as you like. The side agent has read the whole session and can open the project's files. When you're ready, it writes the answer into your reply.</div>
        <div class="sc-sugg">${SUGG.map((t) => `<button class="opt" data-act="side-sugg" data-t="${esc(t)}">${esc(t)}</button>`).join("")}</div>` : ""}
      ${c.msgs.map((m) => m.who === "me" ? `<div class="sc-me enter">${esc(m.text)}</div>` : `<div class="sc-ai enter"><div class="who">${icon("chat", "s12")}Side agent</div>${esc(m.text)}</div>`).join("")}
      ${c.busy ? `<div class="sc-ai"><div class="who"><span class="spin"></span><span class="shine">${esc(c.busy)}</span></div></div>` : ""}
    </div>
    <div class="sc-compose"><textarea id="sc-in" rows="2" placeholder="What's unclear?" aria-label="Message the side agent">${esc(c.draft)}</textarea><button class="send" data-act="side-send" aria-label="Send" ${c.busy ? "disabled" : ""}>${icon("up")}</button></div>
    <div class="sc-actions"><span>${hasAi ? "The answer goes into your reply, for you to check before sending." : ""}</span><span class="sp"></span><button class="btn btn-tint" data-act="side-answer" data-need="${n.id}" ${hasAi && !c.busy ? "" : "disabled"}>Answer with this</button></div>
  </div>`;
}

function renderRail() {
  const a = byId(S.id), rail = $("#rail"), keep = rail.scrollTop;
  if (S.side) { rail.innerHTML = sideChatHTML(a, a.needs.find((n) => n.id === S.side)); rail.scrollTop = rail.scrollHeight; return; }
  const ns = openNeeds(a), nw = newSteps(a);
  const awayNews = nw.filter((s) => !s.current).map((s) => s.sum.replace(/\.$/, "")).slice(0, 2);
  const steps = allSteps(a).length;
  const needsSec = a.needs.length ? `<section>
      <div class="rsec-h">Needs from you ${ns.length ? `<span class="badge">${ns.length}</span>` : ""}<span class="sp"></span><span class="t3">from the whole session</span></div>
      <div class="needs">${a.needs.map((n, i) => needHTML(a, n, i)).join("")}
        ${ns.length ? replyHTML(a) : `<div class="card allclear enter">${icon("check", "s14")}<span>Sent to ${esc(a.harness)} · now. Nothing else needs you here.</span></div>`}
      </div></section>` : "";
  rail.innerHTML = `
    ${nw.length ? `<div class="away"><div class="h">${icon("away", "s14")}While you were away · ${AWAY}</div><p>${plural(nw.length, "new step")}. ${esc(awayNews.join(". "))}${awayNews.length ? "." : ""}${ns.length ? ` It asked ${plural(ns.filter((n) => !n.old).length || ns.length, "question")}.` : ""}</p></div>` : ""}
    ${needsSec}
    <section>
      <div class="rsec-h">Flowchart <span class="t3">${plural(a.goals.length, "request")} · ${plural(steps, "step")}</span><span class="sp"></span><span class="t3">click a step to see it</span></div>
      ${treeHTML(a)}
    </section>
    ${sidesHTML(a)}`;
  rail.scrollTop = keep;
  drawLines();
}

// Side chats stay listed under the flowchart; click one to pick it up again.
function sidesHTML(a) {
  const rows = a.needs.filter((n) => a.chats[n.id] && a.chats[n.id].msgs.length).map((n) => `<button class="srow2" data-act="discuss" data-need="${n.id}">${icon("chat", "s14")}<span class="tl2">${esc(n.q)}</span><span class="t3">${plural(a.chats[n.id].msgs.length, "message")}</span></button>`);
  if (a.id === "pricing") rows.push(`<div class="srow2">${icon("chat", "s14")}<span class="tl2">Is 3 plans enough for small teams?</span><span class="t3">11:40am</span></div>`);
  return rows.length ? `<section class="sides"><div class="rsec-h">On the side</div>${rows.join("")}</section>` : "";
}

function render() {
  renderSide();
  if (S.view === "dash") renderDash(); else renderSess();
}

// ---- Actions ----
function setAnswer(a, id, v) { a.ans[id] = v; }
function sync(a) { if (!a.edited) { const t = $("#replytext"); if (t) t.value = composeText(a); } const b = $("#sendbtn"); if (b) b.disabled = !($("#replytext").value.trim()); }

function send(a) {
  const text = ($("#replytext").value || "").trim(); if (!text) return;
  const btn = $("#sendbtn"); btn.disabled = true; btn.innerHTML = `<span class="spin"></span>Sending`;
  setTimeout(() => {
    for (const n of openNeeds(a)) if (a.ans[n.id]) { n.done = true; n.answer = a.ans[n.id]; }
    // The answers go in as your next message, which continues the current goal.
    const g = a.goals.at(-1), cur = g.steps.find((s) => s.current);
    if (cur) { cur.current = false; }
    a.sent++;
    g.steps.push({ id: `w${a.sent}`, l: "Working on your answers", t: "4:06pm", new: true, current: true, sum: "Reading your reply and carrying on.", sent: text.split("\n") });
    a.state = "working"; a.now = "Working on your answers"; a.count = ""; a.age = "now";
    a.tail = [];
    a.edited = false; a.text = null; a.ans = {};
    render();
    toast(`${icon("check", "s14")}Sent to ${esc(a.harness)} · now`);
  }, 700);
}

function sideReply(a, n, text) {
  const c = a.chats[n.id]; if (!text || c.busy) return;
  c.msgs.push({ who: "me", text }); c.draft = ""; c.busy = "Reading the session and the files"; renderRail();
  setTimeout(() => {
    const k = c.msgs.filter((m) => m.who === "ai").length, pool = [n.side.text, ...(n.chat || [])];
    c.msgs.push({ who: "ai", text: pool[k] || `Taking that into account, I'd still go with “${n.side.pick}”. Press Answer with this when you're happy and I'll write it into your reply.` });
    c.busy = null; renderRail(); $("#sc-in")?.focus();
  }, 1400);
}

function gotoStep(a, stepId) {
  S.open.add(stepId); renderRail();
  const el = $(`#st-${stepId}`); if (!el) return;
  el.scrollIntoView({ block: "center", behavior: "smooth" }); el.classList.add("flash");
}
function gotoNeed(id, need) {
  S.view = "sess"; S.id = id; S.focus = need; render();
  const el = $(`#need-${need}`); if (el) el.scrollIntoView({ block: "center" });
  setTimeout(() => { S.focus = null; const e = $(`#need-${need}`); if (e) e.classList.remove("focus"); }, 2400);
}

document.addEventListener("click", (e) => {
  const t = e.target.closest("[data-act]"); if (!t) return;
  const act = t.dataset.act, a = S.id ? byId(S.id) : null;
  switch (act) {
    case "dash": if (S.view === "sess" && a) a.seen = true; S.side = null; S.view = "dash"; S.open.clear(); render(); $("#main").scrollTop = 0; break;
    case "open": if (S.view === "sess" && a && a.id !== t.dataset.id) a.seen = true; S.view = "sess"; S.id = t.dataset.id; S.side = null; S.open.clear(); render(); break;
    case "tab": S.tab = t.dataset.tab; renderDash(); break;
    case "goto-need": e.stopPropagation(); if (S.view === "sess" && S.id === t.dataset.id) { const el = $(`#need-${t.dataset.need}`); if (el) { el.scrollIntoView({ block: "center", behavior: "smooth" }); el.classList.add("focus"); setTimeout(() => el.classList.remove("focus"), 2400); } } else gotoNeed(t.dataset.id, t.dataset.need); break;
    case "step": if (e.target.closest(".lnk")) break; S.open.has(t.dataset.step) ? S.open.delete(t.dataset.step) : S.open.add(t.dataset.step); renderRail(); break;
    case "goto-step": gotoStep(a, t.dataset.step); break;
    case "opt": { const id = t.dataset.need; a.elseOpen[id] = false; setAnswer(a, id, a.ans[id] === t.dataset.v ? undefined : t.dataset.v); if (a.ans[id] === undefined) delete a.ans[id]; renderRail(); break; }
    case "else": a.elseOpen[t.dataset.need] = true; delete a.ans[t.dataset.need]; renderRail(); setTimeout(() => $(`#else-${t.dataset.need}`)?.focus(), 20); break;
    case "discuss": S.side = t.dataset.need; renderRail(); $("#rail").scrollTop = 0; setTimeout(() => $("#sc-in")?.focus(), 30); break;
    case "side-close": S.side = null; renderRail(); break;
    case "side-sugg": sideReply(a, a.needs.find((n) => n.id === S.side), t.dataset.t); break;
    case "side-send": sideReply(a, a.needs.find((n) => n.id === S.side), ($("#sc-in").value || "").trim()); break;
    case "side-answer": {
      const n = a.needs.find((x) => x.id === t.dataset.need), c = a.chats[n.id];
      c.busy = "Writing your answer"; renderRail();
      setTimeout(() => {
        c.busy = null; a.ans[n.id] = n.side.pick; a.elseOpen[n.id] = !n.opts.some((o) => o[0] === n.side.pick); a.worked[n.id] = true;
        S.side = null; renderRail();
        const el = $(`#need-${n.id}`); if (el) { el.scrollIntoView({ block: "center" }); el.classList.add("flash"); }
        toast(`${icon("check", "s14")}Added to your reply`);
      }, 900);
      break;
    }


    case "send": send(a); break;
    case "show-term": {
      const line = $(`#tscroll [data-tstep="${t.dataset.step}"]`); if (!line) break;
      line.scrollIntoView({ block: "center", behavior: "smooth" });
      let el = line; for (let i = 0; i < 3 && el; i++) { el.classList.remove("hl"); void el.offsetWidth; el.classList.add("hl"); el = el.nextElementSibling; if (el && el.dataset.tstep) break; }
      break;
    }
    case "new": toast(`${icon("plus", "s14")}New session: type and press Enter. Not part of this prototype.`); break;
    case "stop": toast(`${icon("stop", "s14")}Stop asks you to confirm first. Not part of this prototype.`); break;
  }
});
document.addEventListener("keydown", (e) => {
  if (e.target.id === "sc-in" && e.key === "Enter" && !e.shiftKey) { e.preventDefault(); $("[data-act=side-send]")?.click(); return; }
  const t = e.target.closest?.(".trow.step, .arow"); if (t && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); t.click(); }
});
document.addEventListener("input", (e) => {
  const a = S.id ? byId(S.id) : null; if (!a) return;
  if (e.target.id === "sc-in") { const c = a.chats[S.side]; if (c) c.draft = e.target.value; return; }
  if (e.target.id === "replytext") { a.edited = true; a.text = e.target.value; const b = $("#sendbtn"); if (b) b.disabled = !e.target.value.trim(); return; }
  const id = e.target.dataset.else;
  if (id) { const v = e.target.value.trim(); if (v) a.ans[id] = v; else delete a.ans[id]; sync(a); const f = e.target.closest(".need").querySelector(".nfoot .t3"); if (!f && v) e.target.closest(".need").querySelector(".nfoot").insertAdjacentHTML("beforeend", `<span class="t3" style="font-size:13px">In your reply</span>`); }
});
window.addEventListener("resize", () => { if (S.view === "sess") drawLines(); });

// A bare #agent-id in the link opens that session, for example #pricing.
{ const h = location.hash.slice(1); if (byId(h)) { S.view = "sess"; S.id = h; } }
render();
</script>
